name: CI Test & Build Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-verify:
    name: Run Tests & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: 1. TypeScript Static Check
        run: npx tsc --noEmit

      - name: 2. Run Unit & Integration Tests (Vitest)
        run: npm run test

      - name: 3. Production Build Verification
        env:
          NEXT_TELEMETRY_DISABLED: 1
          MONGODB_URI: mongodb://localhost:27017/test
          MONGODB_DB: test
          BETTER_AUTH_SECRET: test_better_auth_secret_minimum_32_characters_long
          BETTER_AUTH_URL: http://localhost:3000
          STRIPE_SECRET_KEY: sk_test_mock
          STRIPE_WEBHOOK_SECRET: whsec_mock
          RESEND_API_KEY: re_mock
        run: npm run build
